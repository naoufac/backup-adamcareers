# ADAMJOBS runtime stack. Web on 8780, API gateway on 8781, services on 8782-8785, Postgres on 127.0.0.1:5433.
# Both app services read .env from the project root via env_file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - adam_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - adam_redis:/data

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      AUTH_PORT: 8782
    ports:
      - "127.0.0.1:8782:8782"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  profiles:
    build:
      context: .
      dockerfile: services/profiles/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      PROFILES_PORT: 8783
    ports:
      - "127.0.0.1:8783:8783"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      BILLING_PORT: 8784
    ports:
      - "127.0.0.1:8784:8784"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  inference-gateway:
    build:
      context: .
      dockerfile: services/inference-gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      INFERENCE_PORT: 8785
    ports:
      - "127.0.0.1:8785:8785"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV}
      # Override to use the internal compose hostname (not the localhost dev URL):
      AUTH_SERVICE_URL: http://auth:8782
      PROFILES_SERVICE_URL: http://profiles:8783
      BILLING_SERVICE_URL: http://billing:8784
      INFERENCE_SERVICE_URL: http://inference-gateway:8785
      USE_SERVICE_PROXY: "true"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "127.0.0.1:8781:8781"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      auth:
        condition: service_started
      profiles:
        condition: service_started
      billing:
        condition: service_started
      inference-gateway:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV}
      # Internal server-to-server URL (compose service name):
      API_BASE_URL: http://api:8781
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "127.0.0.1:8780:8780"
    depends_on:
      - api

volumes:
  adam_pg:
  adam_redis:
